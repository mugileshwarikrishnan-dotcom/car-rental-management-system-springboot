<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rent Car - Car Rental Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #172033;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu-title {
            font-size: 12px;
            color: #9ca8bd;
            margin: 20px 10px 8px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: block;
            color: #dce2ec;
            text-decoration: none;
            padding: 11px 14px;
            margin: 4px 0;
            border-radius: 8px;
            font-size: 14px;
        }

        .sidebar a:hover {
            background: #2d3a52;
            color: white;
        }

        .sidebar .active {
            background: #2d3a52;
            color: white;
        }

        .logout {
            margin-top: 25px !important;
            background: #dc3545;
            text-align: center;
            color: white !important;
        }

        /* Main */
        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .page-header {
            background: white;
            padding: 22px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            color: #172033;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #6c757d;
        }

        /* Form Card */
        .form-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            color: #172033;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6dbe3;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #172033;
        }

        .rent-btn {
            width: 100%;
            padding: 14px;
            background: #172033;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .rent-btn:hover {
            background: #2d3a52;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 22px;
            background: #e9edf3;
            color: #172033;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #dce2ec;
        }

        @media (max-width: 700px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="logo">
        🚗 CAR RENTAL
    </div>

    <a href="/">🏠 Dashboard</a>

    <div class="menu-title">Cars</div>

    <a href="/addcar">➕ Add Car</a>
    <a href="/viewcars">🚘 View Cars</a>
    <a href="/searchcar">🔍 Search Car</a>
    <a href="/updatecar">✏️ Update Car</a>
    <a href="/deletecar">🗑️ Delete Car</a>

    <div class="menu-title">Customers</div>

    <a href="/addcustomer">👤 Add Customer</a>
    <a href="/viewcustomers">👥 View Customers</a>

    <div class="menu-title">Rentals</div>

    <a href="/rentcar" class="active">🔑 Rent Car</a>
    <a href="/viewrentals">📋 View Rentals</a>
    <a href="/returncar">↩️ Return Car</a>
    <a href="/receipt?rentalId=4">🧾 Print Receipt</a>

    <a href="/login" class="logout">🚪 Logout</a>

</div>


<!-- Main Content -->

<div class="main">

    <div class="page-header">
        <h1>🔑 Rent Car</h1>
        <p>Create a new car rental transaction</p>
    </div>


    <div class="form-card">

        <h2>Rental Details</h2>

        <form action="/saverental" method="post">

            <div class="form-group">
                <label>Customer ID</label>
                <input type="number"
                       name="customerId"
                       placeholder="Enter Customer ID"
                       required>
            </div>


            <div class="form-group">
                <label>Car ID</label>
                <input type="number"
                       name="carId"
                       placeholder="Enter Car ID"
                       required>
            </div>


            <div class="form-group">
                <label>Number of Days</label>
                <input type="number"
                       name="days"
                       placeholder="Enter number of rental days"
                       min="1"
                       required>
            </div>


            <button type="submit" class="rent-btn">
                🔑 Rent Car
            </button>

        </form>


        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
